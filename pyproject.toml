[project]
name = "iterm2-mcp-zanlan"
version = "0.1.0"
description = "An iTerm2 MCP server with visible-execution design — send-only, profile-based multi-session management"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zane-lan" }]
keywords = ["mcp", "iterm2", "terminal", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "iterm2==2.30",
    "mcp[cli]>=1,<2",
]

[project.scripts]
iterm2-mcp = "iterm2_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Zane-lan/iterm2-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iterm2_mcp"]
